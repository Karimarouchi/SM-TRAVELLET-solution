server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'app utilise HashRouter (/#/...) : pas de vraies routes côté serveur,
    # mais ce fallback protège quand même les liens directs/rechargements.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
