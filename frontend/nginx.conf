server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'app est servie sous /app/ (voir vite.config.ts: base "/app/" en build)
    # — la racine du domaine sert le site vitrine statique séparément, via la
    # config nginx de l'hôte, pas ce conteneur.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
