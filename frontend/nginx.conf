server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les redirections (/app -> /app/) restent relatives : le conteneur est
    # derrière le nginx de l'hôte, il ne connaît ni le vrai nom ni le HTTPS.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Fichiers de l'application (noms contenant une empreinte) : cache long.
    location ^~ /app/assets/ {
        expires 30d;
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # Styles et scripts de la vitrine : cache court (ils changent avec les mises à jour).
    location ~* \.(?:css|js)$ {
        expires 1h;
    }

    # La page d'entrée ne se met pas en cache : après une mise à jour, le
    # navigateur charge les nouveaux fichiers au lieu de garder l'ancienne application.
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /app/index.html =404;
    }

    # Application React sous /app/ (base: "/app/" dans vite.config.ts).
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Site vitrine à la racine.
    location / {
        try_files $uri $uri/ =404;
    }
}
