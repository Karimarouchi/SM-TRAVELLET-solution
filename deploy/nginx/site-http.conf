# Utilisé tant qu'aucun certificat n'existe : le site est servi en HTTP
# (et répond aussi quand on l'ouvre par l'adresse IP du serveur).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.smtravel.fr smtravel.fr _;

    # Défi Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/smtravel-locations.conf;
}
