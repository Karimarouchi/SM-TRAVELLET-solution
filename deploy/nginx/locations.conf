# Routage du site, commun aux blocs HTTP et HTTPS (inclus par site-*.conf).
#
#   /          -> vitrine statique (cuite dans l'image nginx)
#   /app/      -> conteneur « frontend » (application React)
#   /api/      -> conteneur « backend »  (API)
#   /uploads/  -> conteneur « backend »  (avatars, images de programmes)

root /usr/share/nginx/vitrine;
index index.html;

client_max_body_size 25m;

# DNS interne de Docker. Les adresses sont résolues à chaque requête (variables
# ci-dessous) : nginx démarre même si le backend n'est pas encore prêt.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:3001;
set $frontend_upstream http://frontend:80;

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Fichiers cachés : jamais servis (sauf le défi Let's Encrypt).
location ~ /\.(?!well-known) {
    deny all;
}

location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /uploads/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /app {
    return 301 /app/;
}

location /app/ {
    proxy_pass $frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ =404;
}
