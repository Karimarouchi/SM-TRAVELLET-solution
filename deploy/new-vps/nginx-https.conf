# Phase 2 : HTTPS. Une seule adresse officielle : https://www.smtravel.fr
# (smtravel.fr et le HTTP redirigent vers elle).

# HTTP -> HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.smtravel.fr smtravel.fr _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.smtravel.fr$request_uri;
    }
}

# smtravel.fr (sans www) -> www.smtravel.fr
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smtravel.fr;

    ssl_certificate /etc/letsencrypt/live/www.smtravel.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.smtravel.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.smtravel.fr$request_uri;
}

# Le site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smtravel.fr;

    ssl_certificate /etc/letsencrypt/live/www.smtravel.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.smtravel.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/smtravel-locations.conf;
}
