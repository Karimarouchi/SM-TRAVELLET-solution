# Phase 1 : site servi en HTTP (avant le certificat). Sert aussi de réponse
# par défaut quand on ouvre le serveur par son adresse IP, pratique pour tester.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.smtravel.fr smtravel.fr _;

    # Défi Let's Encrypt (renouvellement automatique du certificat)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/smtravel-locations.conf;
}
