# Routage commun du site (inclus par les blocs « server » HTTP et HTTPS).
# Installé dans /etc/nginx/snippets/smtravel-locations.conf par 02-start-app.sh.
#
#   /          -> site vitrine statique (copié dans /var/www/smtravel-vitrine)
#   /app/      -> application React (conteneur sm-travel-frontend, port 8081)
#   /api/      -> API Node/Express  (conteneur sm-travel-backend,  port 3002)
#   /uploads/  -> images de l'API (avatars, programmes)
#
# IMPORTANT : la racine du site est un dossier dédié, JAMAIS le dossier du
# projet (il contient backend/.env avec tous les secrets).

root /var/www/smtravel-vitrine;
index index.html;

client_max_body_size 25m;

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Fichiers cachés (.env, .git…) : jamais servis.
location ~ /\.(?!well-known) {
    deny all;
}

location /api/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /app {
    return 301 /app/;
}

location /app/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    try_files $uri $uri/ =404;
}
