# Fichier nginx du serveur (hors Docker), comme sur l'ancien serveur.
#
#   cp deploy/new-vps/nginx-smtravel.conf /etc/nginx/sites-available/smtravel
#   ln -s /etc/nginx/sites-available/smtravel /etc/nginx/sites-enabled/smtravel
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d www.smtravel.fr -d smtravel.fr    # ajoute le HTTPS tout seul
#
# Routage :
#   /          -> vitrine statique (dossier /var/www/smtravel)
#   /app/      -> conteneur frontend  (127.0.0.1:8081)
#   /api/      -> conteneur backend   (127.0.0.1:3002)
#   /uploads/  -> conteneur backend

# smtravel.fr (sans www) -> www.smtravel.fr
server {
    listen 80;
    listen [::]:80;
    server_name smtravel.fr;

    location / {
        return 301 https://www.smtravel.fr$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.smtravel.fr;

    root /var/www/smtravel;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fichiers cachés : jamais servis (sauf le défi Let's Encrypt).
    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
