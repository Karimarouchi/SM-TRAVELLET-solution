# Fichier nginx de l'hôte (hors Docker). Tout le site est dans Docker :
#   - le conteneur frontend (127.0.0.1:8081) sert la vitrine ET l'application /app/
#   - le conteneur backend  (127.0.0.1:3002) sert /api/ et /uploads/
# Ce fichier ne fait donc que router ces deux conteneurs ; il n'y a aucun
# dossier de site à gérer à côté du projet.
#
#   cp /var/www/SM-TRAVELLET-solution/deploy/new-vps/nginx-smtravel.conf /etc/nginx/sites-available/smtravel
#   ln -sf /etc/nginx/sites-available/smtravel /etc/nginx/sites-enabled/smtravel
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d www.smtravel.fr -d smtravel.fr --redirect    # ajoute le HTTPS

# smtravel.fr (sans www) -> www.smtravel.fr
server {
    listen 80;
    listen [::]:80;
    server_name smtravel.fr;

    location / {
        return 301 https://www.smtravel.fr$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.smtravel.fr;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tout le reste (vitrine + /app/) : conteneur frontend.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
